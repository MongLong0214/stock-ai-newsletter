name: TLI Weekly Learn

on:
  schedule:
    - cron: '0 21 * * 6'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read lifecycle state or record an already committed gate artifact'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - record-decision
      cycle_id:
        description: 'Canonical prospective cycle UUID; optional only for inspect'
        required: false
        type: string
      decision_kind:
        description: 'Committed decision artifact kind'
        required: true
        default: safety
        type: choice
        options:
          - safety
          - final
      evidence_commit_sha:
        description: 'Full Git commit containing the immutable decision artifact'
        required: false
        type: string
      dry_run:
        description: 'Verify committed evidence without calling the decision RPC'
        required: true
        default: true
        type: boolean

concurrency:
  group: tli-weekly-learn
  cancel-in-progress: false

jobs:
  weekly-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TLI_CYCLE_ID: ${{ inputs.cycle_id }}
      TLI_DECISION_KIND: ${{ inputs.decision_kind }}
      TLI_EVIDENCE_COMMIT_SHA: ${{ inputs.evidence_commit_sha }}
      TLI_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inspect prospective lifecycle
        if: github.event_name == 'schedule' || inputs.operation == 'inspect'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${TLI_CYCLE_ID}" ]; then
            npm run tli:weekly-learn -- inspect --cycle-id="${TLI_CYCLE_ID}" --json-output=tli-weekly-learn-inspect.json
          else
            npm run tli:weekly-learn -- inspect --json-output=tli-weekly-learn-inspect.json
          fi

      - name: Record committed prospective decision
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'record-decision'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TLI_M1_PROMOTION_ENABLED: ${{ vars.TLI_M1_PROMOTION_ENABLED }}
        run: >-
          npm run tli:weekly-learn -- record-decision
          --kind="${TLI_DECISION_KIND}"
          --cycle-id="${TLI_CYCLE_ID}"
          --evidence-commit="${TLI_EVIDENCE_COMMIT_SHA}"
          --dry-run="${TLI_DRY_RUN}"
          --json-output=tli-weekly-learn-record.json

      - name: Upload prospective gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tli-weekly-learn-${{ github.run_id }}
          path: |
            tli-weekly-learn-inspect.json
            tli-weekly-learn-record.json
          if-no-files-found: warn
          retention-days: 30
