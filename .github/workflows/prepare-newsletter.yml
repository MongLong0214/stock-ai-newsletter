name: Prepare Stock Newsletter

on:
  schedule:
    # 평일 오전 6:10/6:40 KST (UTC 전날, 월-금요일만)
    - cron: '10 21 * * 0-4'
    - cron: '40 21 * * 0-4'
  workflow_dispatch: # 수동 실행 가능
    inputs:
      dry_run:
        description: 'DB 저장 없이 전 과정 실검수 (CI E2E용)'
        type: boolean
        default: false
      simulate_today:
        description: '신선도 게이트 기준일 시뮬레이션 (YYYY-MM-DD, dry_run 전용)'
        type: string
        default: ''

# GitHub 스케줄 이벤트가 최대 3시간 지연 발화하므로(2026-09-01 실측 +3h24m) 유령 실행이
# 진행 중인 실행과 겹칠 수 있다. 직렬화해 KIS 동시 수집 충돌을 막는다.
concurrency:
  group: prepare-newsletter
  cancel-in-progress: false

jobs:
  check-market:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Korean market day
        id: check
        run: |
          set -euo pipefail

          # 수동 실행은 항상 허용
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "🔧 수동 실행 — 휴장일 체크 건너뜀"
            exit 0
          fi

          KST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "📅 KST 날짜: $KST_DATE"
          IS_TRADING_DAY=$(KST_DATE="$KST_DATE" npx tsx -e "import { isKoreanTradingDate } from './lib/tli/trading-calendar.ts'; process.stdout.write(String(isKoreanTradingDate(process.env.KST_DATE!)))")
          case "$IS_TRADING_DAY" in
            true)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "✅ 개장일 — 실행"
              ;;
            false)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "🚫 휴장일 ($KST_DATE) — 건너뜀"
              ;;
            *)
              echo "::error::휴장일 판정 결과가 boolean이 아닙니다: $IS_TRADING_DAY"
              exit 1
              ;;
          esac

  prepare-newsletter:
    needs: check-market
    if: needs.check-market.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Google Cloud credentials
        run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > $HOME/gcloud-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV

      - name: Prepare Newsletter (AI Analysis)
        timeout-minutes: 60
        env:
          # KIS API - 시장 스냅샷 수집용
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}

          # Google Cloud (Vertex AI) - Gemini 전용
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1

          # SerpAPI (VIX, USD/KRW, USD/JPY, Event signals)
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}

          # Naver (뉴스 수집, 이벤트 감지)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SIMULATE_TODAY: ${{ inputs.simulate_today || '' }}
          BACKUP_RUN: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          echo "🚀 Starting AI analysis and content preparation..."
          PREPARE_ARGS=()
          if [ "$DRY_RUN" = "true" ]; then
            PREPARE_ARGS+=(--dry-run)
          fi
          if [ -n "$SIMULATE_TODAY" ]; then
            PREPARE_ARGS+=("--simulate-today=$SIMULATE_TODAY")
          fi
          if [ "$BACKUP_RUN" = "true" ]; then
            PREPARE_ARGS+=(--backup-run)
          fi
          PREPARE_LOG=$(mktemp)
          npx tsx scripts/prepare-newsletter.ts "${PREPARE_ARGS[@]}" 2>&1 | tee "$PREPARE_LOG"
          if grep -q 'PICKS_SOURCE=llm_fallback' "$PREPARE_LOG"; then
            echo "::warning::코드 픽 실패 — LLM fallback으로 발행됨"
            echo "### ⚠️ 코드 픽 실패 — LLM fallback으로 발행됨" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json

      - name: Notify on success
        if: success()
        run: echo "✅ Newsletter content prepared successfully! Ready for 07:27 KST sending."

      - name: Notify on failure
        if: failure()
        run: echo "❌ Newsletter preparation failed!!"
