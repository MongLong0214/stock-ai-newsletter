name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install MCP package dependencies
        run: npm ci
        working-directory: mcp

      - name: Typecheck
        run: npx tsc --noEmit

      # 루트 tsconfig는 scripts/를 통째로 exclude한다. 이 스텝이 없으면 scripts/tli는
      # 어디서도 타입체크되지 않는다 — 존재하지 않는 export를 import해도 CI가 통과한다.
      - name: Typecheck (scripts)
        run: npm run typecheck:scripts

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run
