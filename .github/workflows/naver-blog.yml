name: Naver Blog (inside track)

# ⚠️ 이 워크플로는 2026-09-03부터 **수동 비활성(disabled_manually)** 상태다.
# 계정 보호조치가 하루에 2회 발생했다. 재개는 Isaac의 명시적 승인이 필요하다.
#   운영 상태·재개 절차: docs/naver-blog-operations.md
#   빈도·링크·다양성 재설계안: docs/naver-blog-publishing-policy-redesign.md
#
# 아래 전제는 **반증됐다.** 원문을 남겨 둔다 — 무엇을 잘못 가정했는지가 재개 판단의 근거다.
#
#   (원문) "매일 1편. 빈도 자체는 문제가 아니다 — 네이버 C-Rank는 꾸준한 발행을 활동성
#   신호로 보고 상위 블로그는 대부분 매일 쓴다. 위험한 것은 같은 템플릿의 반복이므로
#   5종 로테이션과 14일 테마 쿨다운으로 그쪽을 막는다."
#
# 틀린 지점 셋:
#  1) "상위 블로그는 매일 쓴다"는 **이력이 쌓인 블로그** 이야기다. 8/27 리브랜딩 직후의
#     신생 블로그에 적용할 수 없었다.
#  2) 빈도는 문제였다. 신생 + 매일 + 100% 자동 + 100% 외부링크의 **조합**이 스팸 신호다.
#     안전장치를 개별로 평가한 것이 실수였다 — 네이버가 보는 것은 조합이다.
#  3) 로테이션이 템플릿 반복을 막지 못했다. 발행 8편 중 6편이 동일 제목 틀이고,
#     서로 다른 테마의 구조 수치가 완전히 같았다(인용구 4·볼드 19·색상 4·이미지 5).
#
# WEEKLY_PUBLISH_LIMIT(7)은 스케줄 중복·수동 실행이 겹칠 때의 폭주 방지용이다.
# 재개 시에는 3으로 낮추는 것을 권고한다(주 2회 발행 기준).
on:
  schedule:
    - cron: '0 1 * * *' # 매일 10:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run (입력만 하고 발행하지 않음)'
        type: boolean
        default: false
      # 유형은 평소 KST 날짜에서 파생된다. 특정 유형을 러너에서 검증할 때만 강제한다
      # (조건부 렌더 섹션·집계 캡션은 그 유형이 오는 날에만 밟는 경로다).
      post_type:
        description: '글 유형 강제 (비우면 날짜 파생)'
        type: choice
        default: ''
        options: ['', theme, ranking, similar, news, evergreen]

# 실패 시 이슈를 열려면 issues:write가 필요하다. 기본 권한(contents:read)만으로는
# 403 "Resource not accessible by integration"이 나고, 무인 운영에서 실패 알림이
# 조용히 사라진다(실측 run 33052741707).
permissions:
  contents: read
  issues: write

concurrency:
  group: naver-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # scripts/는 루트 tsconfig의 exclude 대상이라 이 트랙은 타입체크된 적이 없었다.
      - name: Typecheck blog scripts
        run: npm run typecheck:scripts

      # 발행 기록(주간 상한·테마 쿨다운)은 러너 디스크에 남으면 매 실행 초기화된다.
      # 초기화되면 쿨다운이 항상 false가 되어 같은 테마가 연달아 올라간다 — 저품질 트리거다.
      # 자격증명(session.json)은 이 경로 밖이라 캐시에 올라가지 않는다.
      - name: Restore publish state
        uses: actions/cache/restore@v4
        with:
          path: .naver-blog/state
          key: naver-blog-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: naver-blog-state-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 세션을 **draft보다 먼저** 건드린다.
      #
      # NID_AUT·NID_SES는 절대 만료가 없는 세션 쿠키이고 수명은 서버가 활동 기준으로
      # 정한다. 실측(2026-09-03): 8/27 로그인 → 8/31까지 매일 사용하며 생존 → 방화벽
      # 429로 9/1·9/2 draft 단계에서 즉사(네이버 미접촉) → 9/3 세션 사망.
      #
      # 발행 없는 날은 앞으로도 정상적으로 생긴다("후보 전부 검색량 미달 → 오늘은 쓰지
      # 않는다"는 설계된 종료다). 그런 날에도 여기서 세션을 접촉해 두면 썩지 않는다.
      # 만료됐다면 캡처·초안 비용을 쓰기 전에 즉시 멈추고 사람을 부른다.
      - name: Keep session alive
        id: session
        env:
          NAVER_SESSION_B64: ${{ secrets.NAVER_SESSION_B64 }}
        run: npx tsx scripts/naver-blog/session-sync.ts

      # 상승 테마 중 네이버 실측 검색량 200 이상인 것만 채택한다.
      # 전부 미달이면 여기서 실패하고 그 회차는 발행하지 않는다 — 빈칸을 채우지 않는다.
      - name: Generate draft from TLI data
        id: draft
        env:
          # 개별 3개 또는 NAVER_AD_CREDS(JSON) 중 있는 쪽을 쓴다 — credentialsFromEnv가 둘 다 받는다
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CREDS: ${{ secrets.NAVER_AD_CREDS }}
          # 자사 사이트 전체에 Vercel 방화벽 챌린지가 걸려 있다 — 없으면 랭킹 조회가 429로 즉사한다
          STOCKMATRIX_BYPASS_SECRET: ${{ secrets.STOCKMATRIX_BYPASS_SECRET }}
        run: |
          ARGS="--out .naver-blog/draft.json"
          if [ -n "${{ inputs.post_type }}" ]; then
            ARGS="$ARGS --type ${{ inputs.post_type }}"
            echo "유형 강제: ${{ inputs.post_type }}"
          fi
          npx tsx scripts/naver-blog/make-draft.ts $ARGS

      # publish.ts가 발행 직전에 에디터 내용을 되읽어 초안과 대조한다.
      # 셀렉터가 깨지면 검증에서 걸려 발행 없이 실패하므로 빈 글이 올라가지 않는다.
      - name: Publish to Naver
        env:
          NAVER_SESSION_B64: ${{ secrets.NAVER_SESSION_B64 }}
          # 발행 전 스냅샷 신선도 검사가 상세 API를 다시 호출한다
          STOCKMATRIX_BYPASS_SECRET: ${{ secrets.STOCKMATRIX_BYPASS_SECRET }}
        run: |
          MODE="--publish"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            MODE=""
            echo "dry-run 모드"
          fi
          npx tsx scripts/naver-blog/publish.ts .naver-blog/draft.json --headless $MODE

      # 회전된 인증 쿠키를 시크릿에 되돌린다 — 이게 "매번 로그인"을 없애는 부분이다.
      #
      # 발행 성공 여부와 무관하게 돌린다(publish가 실패해도 세션은 이미 접촉·회전됐다).
      # 단 세션 검증이 통과한 회차만 — 죽은 세션을 시크릿에 덮어쓰면 다음 회차까지 오염된다.
      # 스크립트가 push 전에 세션을 한 번 더 검증하므로 이중으로 막힌다.
      #
      # GH_TOKEN은 **시크릿 쓰기 권한 PAT**이라야 한다(기본 GITHUB_TOKEN은 시크릿을 못 쓴다).
      # 없으면 이 단계만 조용히 실패하고 발행 결과에는 영향을 주지 않는다 — 그때는
      # 세션이 회전 없이 살아 있는 동안만 동작하고, 죽으면 사람이 재로그인해야 한다.
      - name: Persist rotated session
        if: always() && steps.session.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_PAT }}
        run: npx tsx scripts/naver-blog/session-sync.ts --push

      # 발행 성공 여부와 무관하게 저장한다 — 실패한 회차도 시도 기록은 남아야 한다.
      # 키에 run_id를 넣는 이유: actions/cache는 같은 키를 덮어쓰지 못한다.
      # continue-on-error를 쓰지 않는다: 발행은 성공했는데 상태 저장만 실패하면
      # 다음 실행이 이전 캐시를 복원해 그 글의 recordPublish·recordTheme·pending 해제가
      # 모두 사라진다(주간 상한 오산, 같은 테마 재선택). 조용히 넘기면 안 되고
      # 잡을 실패시켜 이슈가 열리게 한다.
      - name: Save publish state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .naver-blog/state
          key: naver-blog-state-${{ github.run_id }}-${{ github.run_attempt }}

      # 실패해도 증거를 남긴다 — 셀렉터 문제인지 세션 만료인지 스크린샷으로만 판별된다
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-blog-${{ github.run_id }}
          # `.naver-blog`는 점으로 시작하는 숨은 디렉터리이고 upload-artifact v4는
          # 숨은 파일을 기본 제외한다. 그래서 글롭을 어떻게 써도 0건이었다 —
          # 디렉터리 표기·개별 글롭 나열·`**` 세 가지 모두 실패했다
          # (실측 run 33052381833, 33053124119, 33061455051: total_count=0).
          # 글롭 문제가 아니라 include-hidden-files 문제였다.
          #
          # 이 플래그를 켜면 session.json 제외가 실제로 부하를 받는 지점이 된다.
          # 세션 쿠키가 아티팩트로 새면 계정이 털린다 — 제외 줄을 지우지 말 것.
          include-hidden-files: true
          path: |
            .naver-blog/**
            !.naver-blog/session.json
          retention-days: 14
          if-no-files-found: error

      # 세션은 사람이 로그인한 IP·기기에서 만들어진다. 러너의 데이터센터 IP에서 쓰면
      # 네이버가 만료시킬 수 있고, 그때는 사람이 재로그인해야 한다(자동화 불가).
      # 실패를 조용히 넘기지 않도록 이슈로 올린다.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `네이버 블로그 자동 발행 실패 (${new Date().toISOString().slice(0, 10)})`,
              body: [
                `[실행 로그](${run})의 아티팩트에서 스크린샷을 확인하세요.`,
                '',
                '흔한 원인 세 가지:',
                '- **랭킹/상세 API 429** — 자사 사이트의 Vercel 방화벽 챌린지입니다. 요청량 초과가 아닙니다.',
                '  `STOCKMATRIX_BYPASS_SECRET` 시크릿이 방화벽 우회 규칙의 값과 같은지 확인하세요.',
                '- **세션 만료** — `npm run naver:login` 후 `base64 -i .naver-blog/session.json`으로',
                '  `NAVER_SESSION_B64` 시크릿을 갱신하세요. (자동화 불가 — 로그인 자동화는 계정을 위험하게 합니다)',
                '- **스마트에디터 구조 변경** — `scripts/naver-blog/publish.ts` 상단 `SEL` 표를 갱신하세요.',
                '  발행 전 검증이 걸렸다면 빈 글은 올라가지 않았습니다.',
              ].join('\n'),
              labels: ['naver-blog'],
            });
