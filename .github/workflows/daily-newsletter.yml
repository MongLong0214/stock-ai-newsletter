name: Daily Stock Newsletter
run-name: Send ${{ inputs.target_date || 'today' }} ${{ inputs.dispatch_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '발행 대상 날짜 (YYYY-MM-DD)'
        type: string
        default: ''
      dispatch_id:
        description: 'Vercel cron correlation ID'
        type: string
        default: ''

concurrency:
  group: daily-newsletter
  cancel-in-progress: false

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send Newsletter
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}
          NEWSLETTER_ALERT_EMAIL: ${{ vars.NEWSLETTER_ALERT_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
          DISPATCH_ID: ${{ inputs.dispatch_id || '' }}
        run: |
          set -euo pipefail
          SEND_ARGS=()
          if [ -n "$TARGET_DATE" ]; then SEND_ARGS+=("--target-date=$TARGET_DATE"); fi
          if [ -n "$DISPATCH_ID" ]; then SEND_ARGS+=("--dispatch-id=$DISPATCH_ID"); fi
          npx tsx scripts/send-newsletter.ts "${SEND_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/send-newsletter.log"

      - name: Alert on failure
        if: failure()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          NEWSLETTER_ALERT_EMAIL: ${{ vars.NEWSLETTER_ALERT_EMAIL }}
          DISPATCH_ID: ${{ inputs.dispatch_id || '' }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
        run: |
          npx tsx scripts/verify-newsletter-sent.ts || true
          npx tsx scripts/ops/notify-pipeline-failure.ts --stage=send

      - name: Upload send log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: send-${{ inputs.target_date || 'today' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/send-newsletter.log
          retention-days: 30
