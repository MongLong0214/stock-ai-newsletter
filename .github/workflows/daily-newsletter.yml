name: Daily Stock Newsletter

on:
  schedule:
    # 평일 오전 7:25 KST (UTC 22:25 전날, 월-금요일만)
    - cron: '25 22 * * 0-4'
  workflow_dispatch: # 수동 실행 가능

jobs:
  check-market:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Korean market day
        id: check
        run: |
          # 수동 실행은 항상 허용
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "🔧 수동 실행 — 휴장일 체크 건너뜀"
            exit 0
          fi

          KST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "📅 KST 날짜: $KST_DATE"
          IS_TRADING_DAY=$(KST_DATE="$KST_DATE" npx tsx -e "import tradingCalendar from './lib/tli/trading-calendar.ts'; process.stdout.write(String(tradingCalendar.isKoreanTradingDate(process.env.KST_DATE!)))")
          if [ "$IS_TRADING_DAY" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ 개장일 — 실행"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "🚫 휴장일 ($KST_DATE) — 건너뜀"
          fi

  send-newsletter:
    needs: check-market
    if: needs.check-market.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Google Cloud credentials
        run: |
          echo '${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}' > $HOME/gcloud-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-key.json" >> $GITHUB_ENV

      - name: Send Newsletter
        env:
          # API Keys
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 사용 안 함 (Vertex AI 사용)

          # Google Cloud (Vertex AI) - Gemini 전용
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1

          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # SendGrid
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SENDGRID_FROM_NAME: ${{ secrets.SENDGRID_FROM_NAME }}

          # Twitter/X API
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}

          # Application
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          echo "📧 Starting newsletter sending from prepared content..."
          npx tsx scripts/send-newsletter.ts

      - name: Cleanup credentials
        if: always()
        run: rm -f $HOME/gcloud-key.json

      - name: Notify on success
        if: success()
        run: echo "✅ Newsletter sent successfully!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Newsletter sending failed!!"
