name: Newsletter Sent Watchdog

# 주 워치독은 Vercel(08:15 KST, /api/cron/newsletter-watchdog)이다. 이 cron은 Vercel 자체 장애까지
# 잡는 교차 인프라 백업 알림 — GitHub schedule 특성상 몇 시간 늦게 울릴 수 있지만 알림은 늦어도 유효하다.
on:
  schedule:
    # 평일 오전 8:10 KST 예정 (지연 발화 허용)
    - cron: '10 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-newsletter-sent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify newsletter sent
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          NEWSLETTER_ALERT_EMAIL: ${{ vars.NEWSLETTER_ALERT_EMAIL }}
        run: npx tsx scripts/verify-newsletter-sent.ts
