name: TLI Data Collection

on:
  schedule:
    # 장 마감 후 전체 수집 (평일 KST 16:30 = UTC 07:30)
    - cron: '30 7 * * 1-5'
    # 평일 전체 수집 이중화 (안정 발화 관측대, KST 19:00 = UTC 10:00)
    - cron: '0 10 * * 1-5'
    # 아침 뉴스 수집 (평일+토 KST 09:00 = UTC 00:00)
    - cron: '0 0 * * 1-6'
    # 주말 전체 수집 (일요일 KST 02:00 = UTC 17:00 토요일)
    - cron: '0 17 * * 6'
    # Monday origin 적시 생성 (월요일 KST 18:30 = UTC 09:30)
    - cron: '30 9 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - news-only

# 동시 실행 방지: 진행 중이면 대기 (cancel 대신 queue)
concurrency:
  group: tli-collect
  cancel-in-progress: false

jobs:
  collect-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # wall-clock(date -u)은 runner 큐 지연 시 cron 시각과 어긋나 모드를 오분류한다.
      # github.event.schedule은 지연과 무관하게 트리거된 cron 문자열 그대로다.
      - name: Determine run mode
        id: mode
        env:
          TLI_COLLECT_SCHEDULE: ${{ github.event.schedule }}
          TLI_COLLECT_DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: npx tsx scripts/tli/ops/resolve-collect-mode.ts

      - name: Run TLI Data Collection & Scoring
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
          TLI_MODE: ${{ steps.mode.outputs.mode }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          TLI_COMPARISON_V4_SHADOW_ENABLED: 'true'
          # NOTE: SERVING_ENABLED는 파이프라인에서는 미사용 (Vercel 앱 서버에서 별도 설정 필요)
          TLI_COMPARISON_V4_SERVING_ENABLED: 'true'
          TLI_RESULT_PATH: tli-result.json
        run: npx tsx scripts/tli/batch/collect-and-score.ts

      # 과학 gate step은 severity를 step output으로만 노출하고, 판정은 아래 "Scientific gate result"가
      # 한 번에 내린다. continue-on-error는 critical contract failure를 success로 숨기므로 쓰지 않는다.
      # exit code 규약: 0 pass / 1 operational failure / 2 warning / 3 critical (scientific-gate-exit.ts)
      - name: Prediction parity report
        id: parity
        if: steps.mode.outputs.mode == 'full'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/tli/ops/run-prediction-parity-report.ts > tli-parity-result.json && status=0 || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          {
            echo '## TLI Prediction Parity Report'
            echo "- gate exit code: \`${status}\`"
            echo '```json'
            cat tli-parity-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: TLI watchlist canary
        id: watchlist
        if: steps.mode.outputs.mode == 'full'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          npx tsx scripts/tli/ops/run-theme-watchlist-report.ts --top=5 --bottom=3 \
            | tail -n 1 > tli-watchlist-result.json && status=0 || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          {
            echo '## TLI Watchlist Canary'
            echo "- gate exit code: \`${status}\`"
            echo '```json'
            cat tli-watchlist-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scientific gate artifacts
        if: always() && steps.mode.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: tli-scientific-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tli-parity-result.json
            tli-watchlist-result.json
          if-no-files-found: warn
          retention-days: 30

      # critical contract failure(3)만 workflow를 실패시킨다. 일반 경고(1,2)는 주석만 남긴다.
      - name: Scientific gate result
        if: always() && steps.mode.outputs.mode == 'full'
        env:
          PARITY_STATUS: ${{ steps.parity.outputs.status }}
          WATCHLIST_STATUS: ${{ steps.watchlist.outputs.status }}
        run: |
          failed=0
          for entry in "prediction-parity:${PARITY_STATUS}" "watchlist-canary:${WATCHLIST_STATUS}"; do
            gate="${entry%%:*}"
            status="${entry##*:}"
            case "${status}" in
              0) echo "::notice::${gate} scientific gate passed" ;;
              3) echo "::error::${gate} critical scientific contract failure"; failed=1 ;;
              *) echo "::warning::${gate} non-critical gate result (exit '${status}')" ;;
            esac
          done
          exit "${failed}"

      - name: Notify critical failure
        if: failure()
        env:
          TLI_MODE: ${{ steps.mode.outputs.mode }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rawMode = process.env.TLI_MODE || 'unknown';
            const safeMode = ['full', 'news-only'].includes(rawMode) ? rawMode : 'unknown';
            const now = new Date();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fallbackResult = {
              mode: safeMode,
              criticalFailures: 1,
              warningFailures: 0,
              exitCode: 1,
            };
            let result = fallbackResult;
            if (fs.existsSync('tli-result.json')) {
              try {
                result = JSON.parse(fs.readFileSync('tli-result.json', 'utf8'));
              } catch (error) {
                console.log(`TLI 결과 파일 파싱 실패, fallback critical 알림으로 진행합니다: ${error.message}`);
              }
            }
            if (!result.criticalFailures || result.criticalFailures <= 0) {
              console.log('critical failure가 없어 즉시 이슈 생성을 생략합니다.');
              return;
            }

            const signature = `tli-critical:${safeMode}`;
            const marker = `<!-- tli-signature:${signature} -->`;
            const title = `🚨 TLI critical failure: ${safeMode}`;
            const body = [
              marker,
              `## 파이프라인 critical failure`,
              ``,
              `| 항목 | 값 |`,
              `|------|-----|`,
              `| **실행 모드** | \`${safeMode}\` |`,
              `| **트리거** | \`${context.eventName}\` |`,
              `| **실행 URL** | [링크](${runUrl}) |`,
              `| **시간 (UTC)** | ${now.toISOString()} |`,
              ``,
              `- criticalFailures: ${result.criticalFailures}`,
              `- warningFailures: ${result.warningFailures || 0}`,
            ].join('\n');

            const duplicateWindowMs = 24 * 60 * 60 * 1000;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tli-critical',
              per_page: 20,
            });
            const duplicate = existing.data.find((issue) => {
              const createdAt = new Date(issue.created_at).getTime();
              const ageMs = now.getTime() - createdAt;
              return issue.body?.includes(marker)
                && Number.isFinite(createdAt)
                && ageMs >= 0
                && ageMs <= duplicateWindowMs;
            });
            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body,
              });
              console.log(`최근 24시간 내 동일 critical 이슈 #${duplicate.number}에 코멘트했습니다.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'pipeline-failure', 'tli-critical'],
            });

      - name: Notify warning digest
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('tli-result.json')) {
              console.log('TLI 결과 파일이 없어 warning digest 생성을 생략합니다.');
              return;
            }

            let result;
            try {
              result = JSON.parse(fs.readFileSync('tli-result.json', 'utf8'));
            } catch (error) {
              console.log(`TLI 결과 파일 파싱 실패로 warning digest 생성을 생략합니다: ${error.message}`);
              return;
            }
            if (!result.warningFailures || result.warningFailures <= 0) {
              console.log('warning failure가 없어 digest 생성을 생략합니다.');
              return;
            }

            const now = new Date();
            const kstParts = new Intl.DateTimeFormat('en', {
              timeZone: 'Asia/Seoul',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(now);
            const part = (type) => kstParts.find((item) => item.type === type)?.value;
            const date = `${part('year')}-${part('month')}-${part('day')}`;
            const title = `⚠️ TLI warning digest (${date})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rawMode = result.mode || 'unknown';
            const safeMode = ['full', 'news-only'].includes(rawMode) ? rawMode : 'unknown';
            const body = [
              `## TLI warning digest`,
              ``,
              `| 항목 | 값 |`,
              `|------|-----|`,
              `| **실행 모드** | \`${safeMode}\` |`,
              `| **트리거** | \`${context.eventName}\` |`,
              `| **실행 URL** | [링크](${runUrl}) |`,
              `| **시간 (UTC)** | ${now.toISOString()} |`,
              ``,
              `- warningFailures: ${result.warningFailures}`,
              `- criticalFailures: ${result.criticalFailures || 0}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tli-warning-digest',
              per_page: 20,
            });
            const digest = existing.data.find((issue) => issue.title === title);
            if (digest) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: digest.number,
                body,
              });
              console.log(`오늘 warning digest #${digest.number}에 코멘트했습니다.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['tli-warning', 'tli-warning-digest'],
            });
