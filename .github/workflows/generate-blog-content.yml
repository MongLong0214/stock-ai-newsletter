name: Generate Blog Content

on:
  # 평일 새벽 5:30 KST (UTC 20:30, 일-목 = KST 월-금)
  schedule:
    - cron: '30 20 * * 0-4'

  # 수동 실행 가능
  workflow_dispatch:

concurrency:
  group: generate-blog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-blog:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Playwright 브라우저 캐시
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright 브라우저 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Playwright 시스템 의존성 설치
        run: npx playwright install-deps chromium

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Generate blog content (AI Dynamic Keywords)
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 네이버 검색광고 API — 실측 검색량 게이트. **필수**다.
          # 없으면 generate-blog-post.ts가 시작 전에 exit 1로 멈춘다(예전 fail-open을 닫았다):
          # 자격증명이 없으면 AI가 지어낸 추정 검색량으로 정렬해 발행하게 되기 때문이다.
          # 개별 3개 또는 NAVER_AD_CREDS(JSON) 중 있는 쪽을 쓴다.
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CREDS: ${{ secrets.NAVER_AD_CREDS }}
        run: |
          echo "블로그 파이프라인 실행 (게이트 우선 — 발행은 상한, 할당량 아님)"
          npx tsx scripts/generate-blog-post.ts
